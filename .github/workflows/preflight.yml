name: Preflight Health Checks

on:
  push:
    branches:
      - main
      - 'capstone/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: read

jobs:
  preflight:
    name: Preflight Checks (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macOS arm64
          - os: ubuntu-latest
            platform: Linux
          - os: windows-latest
            platform: Windows
    steps:
      - name: Checkout tooling
        uses: actions/checkout@v4
        with:
          # Research exports contain paths Windows cannot check out.
          # Keep this job scoped to the tooling it actually validates.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/
            /scripts/
            /src/
            /tests/
            /pyproject.toml
            /requirements.txt

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Test preflight reporting and failure handling
        run: python -m unittest discover -s tests -p test_preflight_check.py

      - name: Run preflight checks
        run: python scripts/preflight_check.py

      - name: Upload preflight reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preflight-${{ matrix.os }}-${{ github.run_number }}
          path: reports/preflight/
          retention-days: 30
          if-no-files-found: error
