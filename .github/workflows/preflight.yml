name: Preflight Health Checks

on:
  push:
    branches:
      - main
      - 'capstone/**'
      - 'fix/restore-preflight-scripts'
  pull_request:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Run daily at 6 AM UTC
    - cron: '0 6 * * *'

jobs:
  preflight-macos:
    name: Preflight Checks (macOS arm64)
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run preflight regression tests
        run: python -m unittest discover -s tests -p test_preflight.py -v

      - name: Display system information
        run: |
          echo "=== System Information ==="
          sw_vers
          uname -m
          python3 --version
          which python3
          echo "=========================="

      - name: Install smartmontools (optional)
        run: |
          # Install smartmontools for SMART checks
          # Using || true to not fail if brew has issues
          brew install smartmontools || true
        continue-on-error: true

      - name: Make scripts executable
        run: |
          chmod +x capstone/scripts/preflight_macos.sh
          chmod +x capstone/scripts/preflight_check.py

      - name: Create reports directory
        run: mkdir -p capstone/reports

      - name: Run preflight checks
        id: preflight
        run: |
          cd capstone/scripts
          ./preflight_macos.sh
        env:
          # Optional: Add GitHub token for API checks
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List generated reports
        if: always()
        run: |
          echo "=== Generated Reports ==="
          ls -lh capstone/reports/ || echo "No reports directory found"

      - name: Upload JSON report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preflight-report-macos-${{ github.run_number }}
          path: capstone/reports/*.json
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Markdown report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preflight-markdown-macos-${{ github.run_number }}
          path: capstone/reports/*.md
          retention-days: 30
          if-no-files-found: warn

      - name: Display summary
        if: always()
        run: |
          echo "=== Preflight Check Summary ==="
          shopt -s nullglob
          reports=(capstone/reports/*.md)
          if (( ${#reports[@]} )); then
            # Timestamped filenames sort chronologically; quote the chosen path.
            cat "${reports[${#reports[@]}-1]}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No markdown report found" >> "$GITHUB_STEP_SUMMARY"
          fi

  preflight-linux:
    name: Preflight Checks (Linux)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run preflight regression tests
        run: python -m unittest discover -s tests -p test_preflight.py -v

      - name: Display system information
        run: |
          echo "=== System Information ==="
          uname -a
          python3 --version
          echo "=========================="

      - name: Make scripts executable
        run: |
          chmod +x capstone/scripts/preflight_linux.sh
          chmod +x capstone/scripts/preflight_check.py

      - name: Create reports directory
        run: mkdir -p capstone/reports

      - name: Run preflight checks
        id: preflight
        run: |
          cd capstone/scripts
          ./preflight_linux.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload JSON report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preflight-report-linux-${{ github.run_number }}
          path: capstone/reports/*.json
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Markdown report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preflight-markdown-linux-${{ github.run_number }}
          path: capstone/reports/*.md
          retention-days: 30
          if-no-files-found: warn

  preflight-windows:
    name: Preflight Checks (Windows)
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Extract preflight inputs from workflow commit
        shell: bash
        run: |
          # Git rejects unrelated Windows-invalid paths even in sparse checkout.
          # Archive only these inputs, without constructing the full Git index.
          git init .
          git fetch --depth=1 "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$GITHUB_SHA"
          # Allow Git to inspect the source tree's invalid names, but extract
          # only the two Windows-safe paths explicitly listed below.
          git -c core.protectNTFS=false archive --format=tar FETCH_HEAD capstone tests/test_preflight.py | tar -xf -

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run preflight regression tests
        run: python -m unittest discover -s tests -p test_preflight.py -v

      - name: Display system information
        run: |
          Write-Host "=== System Information ==="
          Get-ComputerInfo | Select-Object WindowsVersion, OsArchitecture
          python --version
          Write-Host "=========================="

      - name: Create reports directory
        run: New-Item -ItemType Directory -Force -Path capstone/reports

      - name: Run preflight checks
        id: preflight
        run: |
          cd capstone/scripts
          .\preflight_windows.ps1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload JSON report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preflight-report-windows-${{ github.run_number }}
          path: capstone/reports/*.json
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Markdown report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preflight-markdown-windows-${{ github.run_number }}
          path: capstone/reports/*.md
          retention-days: 30
          if-no-files-found: warn
