name: Generate Policy Proposal

permissions: {}

on:
  workflow_dispatch:
  schedule:
    - cron: "0 13 * * 1-5"  # 9am ET weekdays

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Generate proposal
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: python scripts/generate_policy_proposal.py
      - name: Commit artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add artifacts/policy_proposal.md || true
          if ! git diff --cached --quiet; then
            git commit -m "Update policy proposal"
            git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64)" \
            for attempt in 1 2 3; do
              git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64)" \
                fetch "https://github.com/${GITHUB_REPOSITORY}.git" "$GITHUB_REF_NAME"
              git rebase --strategy-option=theirs FETCH_HEAD
              if git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64)" \
                push "https://github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                exit 1
              fi
            done
          else
            echo "No changes to commit"
          fi
