name: Generate Policy Proposal

on:
  workflow_dispatch:
  schedule:
    - cron: "0 13 * * 1-5"  # 9am ET weekdays

permissions:
  contents: read

concurrency:
  group: policy-proposal
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check integration configuration
        id: configuration
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Proposal generation was not run: configure the OPENAI_API_KEY repository Actions secret." >> "$GITHUB_STEP_SUMMARY"
            if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
              echo "::error::OPENAI_API_KEY is required for manual proposal generation."
              exit 1
            fi
            echo "::warning::Scheduled generation skipped: OPENAI_API_KEY is not configured."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        if: steps.configuration.outputs.ready == 'true'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: steps.configuration.outputs.ready == 'true'
        with:
          python-version: "3.11"
      - name: Install dependencies
        if: steps.configuration.outputs.ready == 'true'
        run: python -m pip install -r requirements.txt
      - name: Generate proposal
        if: steps.configuration.outputs.ready == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: python scripts/generate_policy_proposal.py
      - name: Commit artifact
        if: steps.configuration.outputs.ready == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add artifacts/policy_proposal.md || true
          if ! git diff --cached --quiet; then
            git commit -m "Update policy proposal"
            git push
          else
            echo "No changes to commit"
          fi
