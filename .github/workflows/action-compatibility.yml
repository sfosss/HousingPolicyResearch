name: Action Compatibility

on:
  pull_request:
    paths:
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout workflow files
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'

      - name: Install declared validation dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify immutable workflow action references
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import yaml
          def check(reference):
              if reference is None:
                  return
              assert isinstance(reference, str), reference
              if reference.startswith('./'):
                  return
              if reference.startswith('docker://'):
                  assert re.fullmatch(r'docker://[^@\s]+@sha256:[0-9a-f]{64}', reference), reference
              else:
                  assert re.fullmatch(r'[^@]+@[0-9a-f]{40}', reference), reference
          workflows = Path('.github/workflows')
          for path in sorted([*workflows.glob('*.yml'), *workflows.glob('*.yaml')]):
              workflow = yaml.safe_load(path.read_text(encoding='utf-8'))
              for job in workflow.get('jobs', {}).values():
                  check(job.get('uses'))
                  for step in job.get('steps', []):
                      check(step.get('uses'))
          print('All external workflow references are immutable')
          PY

      - name: Lint workflow syntax and expressions
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -shellcheck='' -pyflakes=''

      - name: Set up Quarto without rendering or publishing
        uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2

      - name: Check Quarto installation
        run: quarto --version

