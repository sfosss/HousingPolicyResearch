name: Unified Repository Assessment

on:
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * 1"

# Read-only by design: this workflow assesses both the checked-out files and the
# hosted repository. Remediation remains an explicitly reviewed administrator or
# pull-request action.
permissions:
  contents: read
  issues: read
  pull-requests: read
  security-events: read
  actions: read

jobs:
  assess:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Assess local and hosted state
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/audit_repository_state.py \
            --json-output repository-assessment.json \
            --markdown-output repository-assessment.md
          cat repository-assessment.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload sanitized assessment
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: repository-assessment-${{ github.run_number }}
          path: |
            repository-assessment.json
            repository-assessment.md
          retention-days: 30
